name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # Throwaway CI database, defined here on purpose: no secrets are used.
  TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/secureauth_test?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: secureauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d secureauth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # npm ci already runs postinstall/prisma generate; explicit for clarity.
      - run: npx prisma generate

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
